<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Mason Hsu — Chief Product Officer and AI builder</title>
  <desc id="desc">Animated profile panel highlighting product leadership, AI systems, zero-to-one execution, and Taipei.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#5DD39E"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="type-1">
      <rect x="126" y="265" width="0" height="34">
        <animate attributeName="width" values="0;0;470;470;0;0" keyTimes="0;0.01;0.13;0.23;0.25;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="type-2">
      <rect x="126" y="265" width="0" height="34">
        <animate attributeName="width" values="0;0;470;470;0;0" keyTimes="0;0.25;0.37;0.48;0.5;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="type-3">
      <rect x="126" y="265" width="0" height="34">
        <animate attributeName="width" values="0;0;470;470;0;0" keyTimes="0;0.5;0.62;0.73;0.75;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="type-4">
      <rect x="126" y="265" width="0" height="34">
        <animate attributeName="width" values="0;0;470;470;0" keyTimes="0;0.75;0.87;0.98;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="720" height="540" rx="24" fill="url(#panel)"/>
  <g opacity="0.20" stroke="#30363D">
    <path d="M0 90H720M0 180H720M0 270H720M0 360H720M0 450H720"/>
    <path d="M120 0V540M240 0V540M360 0V540M480 0V540M600 0V540"/>
  </g>
  <circle cx="642" cy="70" r="94" fill="#1F6FEB" opacity="0.10" filter="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
    <g transform="translate(48 46)">
      <rect width="34" height="34" rx="9" fill="#161B22" stroke="#30363D"/>
      <path d="M10 22V13l7-4 7 4v9l-7 4z" fill="none" stroke="#58A6FF" stroke-width="2"/>
      <circle cx="17" cy="17" r="3" fill="#5DD39E"/>
      <text x="49" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.1" fill="#8B949E">MASON / PRODUCT OS</text>
    </g>

    <text x="48" y="145" font-size="57" font-weight="720" letter-spacing="-2.5" fill="#F0F6FC">Mason Hsu</text>
    <text x="48" y="185" font-size="21" font-weight="600" fill="#C9D1D9">CPO <tspan fill="#58A6FF">×</tspan> Head of AI <tspan fill="#5DD39E">×</tspan> Builder</text>
    <text x="48" y="218" font-size="15" fill="#8B949E">Turning ambiguous problems into products people can use.</text>

    <g transform="translate(48 242)">
      <rect width="624" height="120" rx="15" fill="#08090A" stroke="#30363D"/>
      <circle cx="20" cy="20" r="4" fill="#FF7B72"/>
      <circle cx="34" cy="20" r="4" fill="#D29922"/>
      <circle cx="48" cy="20" r="4" fill="#3FB950"/>
      <text x="70" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6E7681">mason@product-os:~$</text>

      <g opacity="1">
        <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.23;0.25;0.75;0.99;1" dur="10s" repeatCount="indefinite"/>
        <g transform="translate(24 50)">
          <rect width="40" height="40" rx="10" fill="#11233D" stroke="#1F6FEB"/>
          <path d="M11 27h18M13 23l5-6 4 4 6-9" fill="none" stroke="#58A6FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="78" y="83" clip-path="url(#type-1)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#F0F6FC">BUILDING <tspan fill="#58A6FF">AI-NATIVE</tspan> PRODUCTS</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.25;0.48;0.5;1" dur="10s" repeatCount="indefinite"/>
        <g transform="translate(24 50)">
          <rect width="40" height="40" rx="10" fill="#10261F" stroke="#2EA66F"/>
          <circle cx="20" cy="20" r="10" fill="none" stroke="#5DD39E" stroke-width="2"/>
          <path d="M20 13v14M13 20h14" stroke="#5DD39E" stroke-width="2" stroke-linecap="round"/>
        </g>
        <text x="78" y="83" clip-path="url(#type-2)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#F0F6FC">LEADING <tspan fill="#5DD39E">0 → 1</tspan> PRODUCT SYSTEMS</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.73;0.75;1" dur="10s" repeatCount="indefinite"/>
        <g transform="translate(24 50)">
          <rect width="40" height="40" rx="10" fill="#231D35" stroke="#8B6FCF"/>
          <path d="M12 21h12M20 14l7 7-7 7" fill="none" stroke="#BC8CFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <text x="78" y="83" clip-path="url(#type-3)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#F0F6FC">SHIP <tspan fill="#BC8CFF">→ MEASURE →</tspan> ITERATE</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.75;0.98;1" dur="10s" repeatCount="indefinite"/>
        <g transform="translate(24 50)">
          <rect width="40" height="40" rx="10" fill="#2B2114" stroke="#C68A2B"/>
          <circle cx="20" cy="20" r="10" fill="none" stroke="#E3B341" stroke-width="2"/>
          <path d="M10 20h20M20 10c3 3 4 6 4 10s-1 7-4 10M20 10c-3 3-4 6-4 10s1 7 4 10" fill="none" stroke="#E3B341" stroke-width="1.5"/>
        </g>
        <text x="78" y="83" clip-path="url(#type-4)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#F0F6FC">TAIPEI <tspan fill="#E3B341">→</tspan> BUILDING GLOBALLY</text>
      </g>

      <rect x="586" y="65" width="7" height="24" rx="1" fill="#58A6FF">
        <animate attributeName="opacity" values="1;1;0;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(48 393)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
      <g>
        <rect width="184" height="38" rx="19" fill="#161B22" stroke="#30363D"/>
        <circle cx="19" cy="19" r="4" fill="#58A6FF"/>
        <text x="33" y="23" fill="#C9D1D9">PRODUCT STRATEGY</text>
      </g>
      <g transform="translate(198)">
        <rect width="178" height="38" rx="19" fill="#161B22" stroke="#30363D"/>
        <circle cx="19" cy="19" r="4" fill="#5DD39E"/>
        <text x="33" y="23" fill="#C9D1D9">AGENT SYSTEMS</text>
      </g>
      <g transform="translate(390)">
        <rect width="187" height="38" rx="19" fill="#161B22" stroke="#30363D"/>
        <circle cx="19" cy="19" r="4" fill="#BC8CFF"/>
        <text x="33" y="23" fill="#C9D1D9">0→1 EXECUTION</text>
      </g>
    </g>

    <path d="M48 476H672" stroke="#30363D"/>
    <circle cx="54" cy="505" r="5" fill="#5DD39E">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="69" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#8B949E">DISCOVER / DEFINE / BUILD / SHIP / LEARN</text>
  </g>
</svg>
