<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-labelledby="title desc">
  <title id="title">Mason Product OS</title>
  <desc id="desc">Animated product operating system from friction to wedge, system, shipping, and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F8F4EC"/>
      <stop offset="1" stop-color="#EEE8DE"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#76A8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="720" height="440" rx="28" fill="url(#bg)"/>

  <g transform="translate(42 40)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="780" letter-spacing="2" fill="#746C62">PRODUCT OS // 0→1</text>
    <text x="0" y="34" font-size="25" font-weight="780" fill="#1C1C1C">Find friction. Build the wedge. Ship the loop.</text>
  </g>

  <!-- pipeline -->
  <g transform="translate(42 112)" filter="url(#shadow)">
    <rect width="636" height="126" rx="21" fill="#11151B"/>
    <g transform="translate(25 25)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <path d="M45 32 H530" stroke="#39414B" stroke-width="3" stroke-linecap="round"/>
      <path d="M45 32 H530" stroke="#1F6FEB" stroke-width="3" stroke-linecap="round" stroke-dasharray="70 500">
        <animate attributeName="stroke-dashoffset" values="70;-530" dur="5.2s" repeatCount="indefinite"/>
      </path>

      <g fill="#161C24" stroke="#66707D">
        <circle cx="45" cy="32" r="13"/>
        <circle cx="166" cy="32" r="13"/>
        <circle cx="287" cy="32" r="13"/>
        <circle cx="408" cy="32" r="13"/>
        <circle cx="530" cy="32" r="13"/>
      </g>
      <circle cx="45" cy="32" r="5" fill="#5DD39E"/>
      <circle cx="166" cy="32" r="5" fill="#7EA9F8"/>
      <circle cx="287" cy="32" r="5" fill="#7EA9F8"/>
      <circle cx="408" cy="32" r="5" fill="#7EA9F8"/>
      <circle cx="530" cy="32" r="5" fill="#5DD39E"/>

      <g fill="#E8EBEF" font-size="11" font-weight="700" text-anchor="middle">
        <text x="45" y="68">FRICTION</text>
        <text x="166" y="68">WEDGE</text>
        <text x="287" y="68">SYSTEM</text>
        <text x="408" y="68">SHIP</text>
        <text x="530" y="68">LEARN</text>
      </g>
      <g fill="#7F8996" font-size="9.5" text-anchor="middle">
        <text x="45" y="86">observe</text>
        <text x="166" y="86">scope</text>
        <text x="287" y="86">build</text>
        <text x="408" y="86">instrument</text>
        <text x="530" y="86">iterate</text>
      </g>
    </g>
  </g>

  <!-- signals -->
  <g transform="translate(42 270)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="0" y="0" font-size="12" font-weight="780" letter-spacing="1.8" fill="#746C62">I WATCH THREE LOOPS</text>

    <g transform="translate(0 20)">
      <rect width="190" height="106" rx="18" fill="#FFFFFF" stroke="#D9D1C6"/>
      <text x="18" y="28" font-size="11" font-weight="800" fill="#1F6FEB">USER</text>
      <text x="18" y="55" font-size="18" font-weight="760" fill="#242424">Use → Return</text>
      <text x="18" y="78" font-size="11.5" fill="#777067">friction · feedback · behavior</text>
      <circle cx="165" cy="25" r="5" fill="#5DD39E">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(207 20)">
      <rect width="190" height="106" rx="18" fill="#FFFFFF" stroke="#D9D1C6"/>
      <text x="18" y="28" font-size="11" font-weight="800" fill="#1F6FEB">SYSTEM</text>
      <text x="18" y="55" font-size="18" font-weight="760" fill="#242424">Work → Hold</text>
      <text x="18" y="78" font-size="11.5" fill="#777067">latency · cost · reliability</text>
      <path d="M18 91 H145" stroke="#E4E7EB" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 91 H111" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" stroke-dasharray="93" stroke-dashoffset="93">
        <animate attributeName="stroke-dashoffset" values="93;0;0" keyTimes="0;0.65;1" dur="3.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(414 20)">
      <rect width="222" height="106" rx="18" fill="#FFFFFF" stroke="#D9D1C6"/>
      <text x="18" y="28" font-size="11" font-weight="800" fill="#1F6FEB">BUSINESS</text>
      <text x="18" y="55" font-size="18" font-weight="760" fill="#242424">Value → Repeat</text>
      <text x="18" y="78" font-size="11.5" fill="#777067">pricing · distribution · economics</text>
      <text x="175" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#5DD39E">$ viable</text>
    </g>
  </g>

  <text x="42" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="650" fill="#8A8176">// working software creates better strategy</text>
</svg>