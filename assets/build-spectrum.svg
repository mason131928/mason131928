  <g transform="translate(44 266)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#7E8895">
    <text x="0" y="0">software ←──────────────────────────── product constraints ────────────────────────────→ physical world</text>
