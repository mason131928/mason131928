<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mason Hsu — AI Product Builder</title>
  <desc id="desc">Personal brand banner for Mason Hsu: AI, Product, Strategy, Impact.</desc>
  <defs>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#ECE6DA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#67A4FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#warm)"/>
  <circle cx="1040" cy="75" r="130" fill="#DCE8FA" opacity="0.68" filter="url(#soft)"/>
  <circle cx="1110" cy="310" r="100" fill="#F2D9BF" opacity="0.5" filter="url(#soft)"/>

  <g opacity="0.42" stroke="#B4AA9C" stroke-width="1">
    <path d="M815 58 H1130"/>
    <path d="M815 86 H1090"/>
    <path d="M870 276 H1140"/>
  </g>

  <g transform="translate(74 70)">
    <rect width="12" height="12" rx="3" fill="#1F6FEB"/>
    <text x="24" y="11" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="15" font-weight="700" letter-spacing="2.4" fill="#5D574F">AI PRODUCT BUILDER</text>

    <text x="0" y="98" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="72" font-weight="760" letter-spacing="-2.8" fill="#191919">MASON HSU</text>
    <rect x="0" y="123" width="190" height="6" rx="3" fill="url(#accent)"/>

    <text x="0" y="180" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="25" font-weight="650" fill="#33302C">AI × PRODUCT × STRATEGY × IMPACT</text>
    <text x="0" y="222" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="18" fill="#6B655D">Turning ideas into systems people can actually use.</text>
  </g>

  <g transform="translate(850 128)">
    <rect x="0" y="0" width="235" height="58" rx="16" fill="#FFFFFF" opacity="0.78" stroke="#D8D0C4"/>
    <circle cx="31" cy="29" r="7" fill="#1F6FEB">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="50" y="25" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="13" font-weight="700" fill="#302D29">BUILDING NOW</text>
    <text x="50" y="42" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="12" fill="#797168">AI-native product systems</text>
  </g>

  <g transform="translate(840 224)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="12" font-weight="700" fill="#6A635B">
    <text x="0" y="0">01  DISCOVER</text>
    <text x="112" y="0">02  BUILD</text>
    <text x="205" y="0">03  SHIP</text>
    <text x="290" y="0">04  LEARN</text>
  </g>
</svg>
