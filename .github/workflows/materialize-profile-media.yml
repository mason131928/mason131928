name: Materialize profile media

on:
  push:
    paths:
      - 'assets/mason-builder-live.ready'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode animated profile asset
        shell: bash
        run: |
          cat assets/mason-builder-live.gif.b64.part-* | tr -d '\n\r' | base64 --decode > assets/mason-builder-live.gif
          file assets/mason-builder-live.gif

      - name: Commit generated GIF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mason-builder-live.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add animated Mason builder visual"
          git push
