      <text x="0" y="-5" text-anchor="middle" font-size="13" font-weight="760" fill="#F2F4F7">Housebook</text>
      <text x="0" y="67" text-anchor="middle" font-size="10.5" fill="#8F99A6">MICRO-SAAS</text>
