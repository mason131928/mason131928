<svg xmlns="http://www.w3.org/2000/svg" width="460" height="345" viewBox="0 0 460 345" role="img" aria-labelledby="title desc">
  <title id="title">Mason Hsu — builder at work</title>
  <desc id="desc">Animated product and AI workspace based on Mason's builder illustration.</desc>
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="460" height="345" rx="22" fill="#f7f2e9"/>
  <image href="data:image/jpeg;base64," width="460" height="345" preserveAspectRatio="xMidYMid slice"/>
  <rect x="278" y="114" width="142" height="105" rx="14" fill="none" stroke="#5865f2" stroke-width="2" opacity="0.08">
    <animate attributeName="opacity" values="0.06;0.30;0.06" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="371" cy="52" r="5" fill="#35c99a" opacity="0.2" filter="url(#glow)">
    <animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <path d="M32 120 C95 52 164 80 217 55 C285 24 347 33 429 86" fill="none" stroke="#5268f4" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 10" opacity="0.35">
    <animate attributeName="stroke-dashoffset" values="0;-45" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle r="4" fill="#315efb" opacity="0.9">
    <animateMotion path="M32 120 C95 52 164 80 217 55 C285 24 347 33 429 86" dur="6s" repeatCount="indefinite"/>
  </circle>
  <rect x="395" y="202" width="42" height="19" rx="6" fill="none" stroke="#6c63ff" stroke-width="2" opacity="0.25">
    <animate attributeName="opacity" values="0.08;0.55;0.08" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</svg>